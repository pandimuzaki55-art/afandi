<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>N5–N1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#172033;font:15px system-ui,Arial}header{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:5}h1{margin:0 0 4px}.sub{opacity:.78}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;background:#e8ebf2}button.active,.primary{background:#2563eb;color:#fff}main{max-width:1120px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:16px;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#667085}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:700}.big{font-size:65px;text-align:center;font-weight:800}.kana{font-size:28px;text-align:center;background:#f8fafc;padding:14px;border-radius:10px}.table{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:7px}.progress{height:11px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2563eb}.option{display:block;width:100%;text-align:left;margin:8px 0;border:2px solid transparent;background:#f8fafc}.option.correct{background:#dcfce7;border-color:#22c55e}.option.wrong{background:#fee2e2;border-color:#ef4444}.stat{font-size:30px;font-weight:800}.ok{background:#ecfdf5;padding:10px;border-radius:10px}.warn{background:#fff7ed;padding:10px;border-radius:10px}.formula{font-size:23px;background:#f8fafc;padding:12px;border-radius:10px;text-align:center}.ja{font-size:20px}.day{padding:8px;background:#f8fafc;border-radius:9px}.source{font-size:12px;color:#667085}.fw{max-width:720px;margin:0 auto}.fcard{min-height:330px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;border:2px solid #dbe3ef}.ff{font-size:86px;font-weight:900}.fword{font-size:52px;font-weight:900}.fb{font-size:22px;line-height:1.55}.fcc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.stroke{max-width:280px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px}
</style></head><body>
<header><h1>🇯🇵 N5–N1</h1><div class="sub">Hiragana → Katakana → Kanji → Kosakata → Grammar</div><div class="row" id="mode" style="margin-top:12px"></div><nav id="nav"></nav></header><main id="app"></main>
<script>
const LV=['N5','N4','N3','N2','N1'],KEY='jm_all_v1',$=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
let level='N5',page='home',data={kanji:[],vocab:[]},dataMsg='Memuat data...',wk=[],wkMsg='',vs='wk';
let st;try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){st={}}
st={total:0,correct:0,sessions:0,today:0,day:'',streak:0,goal:10,days:{},rv:{},mode:'id',...st};
const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
let M=st.mode||'id';
/* ---- Terjemahan Inggris → Indonesia (otomatis, disimpan di perangkat) ---- */
let tr={},tried=new Set();try{tr=JSON.parse(localStorage.getItem('jm_tr')||'{}')}catch(e){}
const mt=x=>Array.isArray(x.meanings)?x.meanings.slice(0,3).join('; '):String(x.meanings||'');
const mean=x=>x.src==='wk'?mt(x):(tr[mt(x)]||mt(x));
async function trans(t){try{const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|id&q='+encodeURIComponent(t));const j=await r.json(),o=j.responseData&&j.responseData.translatedText;if(o&&+j.responseStatus===200&&!/MYMEMORY|QUERY LENGTH/i.test(o))tr[t]=o.toLowerCase()}catch(e){}}
async function trAll(items){const ts=[...new Set(items.filter(x=>x.src!=='wk').map(mt).filter(t=>t&&!tr[t]&&!tried.has(t)))];ts.forEach(t=>tried.add(t));
 for(let i=0;i<ts.length;i+=4)await Promise.all(ts.slice(i,i+4).map(trans));
 try{localStorage.setItem('jm_tr',JSON.stringify(tr))}catch(e){}return ts.length}
const lazyTr=items=>trAll(items).then(n=>{if(n)render()});

/* ---- Data (hanya bahasa Jepang: kanji + onyomi/kunyomi, kosakata + bacaan) ---- */
const toK=s=>String(s||'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
async function fj(p){for(const b of ['https://cdn.jsdelivr.net/gh/evanclan/OpenJLPT@main/data/json/','https://raw.githubusercontent.com/evanclan/OpenJLPT/main/data/json/']){try{const r=await fetch(b+p);if(r.ok)return await r.json()}catch(e){}}return[]}
async function loadOnline(){
 const res=await Promise.all(LV.flatMap(l=>[fj('kanji/'+l.toLowerCase()+'.json'),fj('vocab/'+l.toLowerCase()+'.json')].map(p=>p.then(a=>a.map(x=>({...x,level:x.level||l}))))));
 let ks=res.filter((_,i)=>i%2===0).flat(),vv=res.filter((_,i)=>i%2===1).flat();
 try{const r=await fetch('https://cdn.jsdelivr.net/gh/davidluzgouveia/kanji-data@master/kanji.json');
  if(r.ok){const j=await r.json(),have=new Set(ks.map(x=>x.character));
   for(const [c,v] of Object.entries(j)){if(!v.jlpt_new||have.has(c))continue;ks.push({character:c,level:'N'+v.jlpt_new,strokes:v.strokes,meanings:v.meanings||[],onyomi:(v.readings_on||[]).map(toK),kunyomi:v.readings_kun||[]})}}}catch(e){}
 if(ks.length)data.kanji=ks;if(vv.length)data.vocab=vv;
 dataMsg=(ks.length||vv.length)?`Data dimuat: ${ks.length} kanji, ${vv.length} kosakata.`:'Data online belum termuat — periksa internet.';render()}
const WI={N5:'https://wkwkjapan.com/kosakata/daftar-kosakata-jlpt-n5/',N4:'https://wkwkjapan.com/kosakata/daftar-kosakata-jlpt-n4/',N3:'https://wkwkjapan.com/kosakata/daftar-kosakata-n3/'};
const jina=async u=>{const r=await fetch('https://r.jina.ai/'+u);if(!r.ok)throw 0;return r.text()};
const wl=md=>[...new Set([...md.matchAll(/\]\((https?:\/\/wkwkjapan\.com\/kosakata\/[^)#?\s]+)/g)].map(m=>m[1].replace(/\/$/,'')))];
const cl=v=>String(v||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').replace(/^\s*\((.*?)\)\s*$/,'$1').trim();
function wp(md,lv){const o=[];for(const l of md.split('\n')){const m=l.trim().match(/^\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|/);if(!m)continue;const w=cl(m[1]),r=cl(m[2]),t=cl(m[3]);
 if(!w||!t||/^(bahasa jepang|japanese|kata|kanji wajib|bacaan)$/i.test(w)||/^[-: ]+$/.test(w)||/^(bahasa indonesia|indonesian)$/i.test(t)||!/[ぁ-ゖァ-ヺ一-龯々ー]/.test(w)||w.length>80||t.length>300)continue;o.push({word:w,reading:r,meanings:[t],level:lv,src:'wk'})}return o}
async function loadWk(force){
 if(!force){try{const c=JSON.parse(localStorage.getItem('jm_wkwk_vocab_v2')||'null');if(c&&c.length){wk=c.map(x=>({...x,src:'wk'}));wkMsg='WkwkJepang: '+wk.length+' kata (tersimpan).';render();return}}catch(e){}}
 wk=[];
 for(const lv of ['N5','N4','N3']){wkMsg='Memuat WkwkJepang '+lv+'...';render();
  try{const q=[WI[lv]],seen=new Set(),out=[];
   while(q.length&&seen.size<150){const u=q.shift().replace(/\/$/,'');if(seen.has(u))continue;seen.add(u);
    try{const md=await jina(u);out.push(...wp(md,lv));for(const v of wl(md))if(!seen.has(v)&&q.length<400)q.push(v)}catch(e){}}
   const s=new Set();wk.push(...out.filter(x=>{const k=x.word+'|'+x.reading+'|'+x.level;if(s.has(k))return false;s.add(k);return true}))}catch(e){}}
 if(wk.length){try{localStorage.setItem('jm_wkwk_vocab_v2',JSON.stringify(wk))}catch(e){}wkMsg='WkwkJepang: '+wk.length+' kata.'}else wkMsg='WkwkJepang gagal dimuat — sementara memakai OpenJLPT.';
 render()}
const sV=()=>{const h=new Set(wk.map(x=>x.level));return [...wk,...data.vocab.filter(x=>!h.has(x.level))]};
const kL=()=>data.kanji.filter(x=>x.level===level),vL=()=>data.vocab.filter(x=>x.level===level);
const yomi=x=>'On: '+((x.onyomi||[]).join('、')||'—')+'\nKun: '+((x.kunyomi||[]).join('、')||'—');
const stroke=c=>'https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/'+c.codePointAt(0).toString(16).padStart(5,'0')+'.svg';
const kItem=x=>({id:x.character+'|'+x.level,t:'kanji',front:x.character,back:yomi(x),arti:mean(x),level:x.level});
const vItem=x=>({id:x.word+'|'+(x.reading||'')+'|'+x.level,t:'vocab',front:x.word,back:x.reading||'',arti:mean(x),level:x.level});
/* ---- Review per tanggal: tiap hari punya daftar sendiri, tidak digabung ---- */
const RV=new Map(),inToday=id=>(st.rv[today()]||[]).some(x=>x.id===id);
function rvBtn(it){RV.set(it.id,it);const on=inToday(it.id);
 return `<button class="${on?'primary':''}" onclick="event.stopPropagation();rv('${encodeURIComponent(it.id).replace(/'/g,'%27')}',this)">${on?'⭐ Sudah di Review hari ini':'⭐ Masukkan ke Review hari ini'}</button>`}
function rv(id,el){id=decodeURIComponent(id);const p=RV.get(id);if(!p)return;const d=today(),a=st.rv[d]||[],on=a.some(x=>x.id===id);
 st.rv[d]=on?a.filter(x=>x.id!==id):[...a,{...p,known:null}];if(!st.rv[d].length)delete st.rv[d];save();
 if(el){el.className=on?'':'primary';el.textContent=on?'⭐ Masukkan ke Review hari ini':'⭐ Sudah di Review hari ini'}}
const br=s=>esc(s).replace(/\n/g,'<br>');
let rvs=null,rvL='all';
const rvAll=()=>{const o={};for(const d in st.rv){const a=st.rv[d].filter(x=>rvL==='all'||x.level===rvL);if(a.length)o[d]=a}return o};
const bk=x=>x.back||(()=>{const k=data.kanji.find(k=>k.character===x.front);return k?yomi(k):''})();
const rb=x=>br(bk(x))+(M==='id'&&x.arti?'<br><i>'+esc(x.arti)+'</i>':'');
function review(a){
 if(rvs){const q=rvs.items[rvs.pos];
  a.innerHTML=`<div class="card fw"><div class="row"><span class="pill">📅 ${rvs.d}</span><span class="pill">${q.level}</span><span class="pill">${rvs.pos+1}/${rvs.items.length}</span></div><div class="card fcard" onclick="rvs.flip=!rvs.flip;render()">${rvs.flip?`<div class="fb"><b>${rb(q)}</b></div>`:`<div class="ff" style="font-size:${q.front.length>2?48:86}px">${esc(q.front)}</div>`}</div><div class="fcc"><button onclick="rAns(false)">❌ Belum hafal</button><button class="primary" onclick="rAns(true)">✅ Hafal</button></div><div class="fcc"><button onclick="rvs=null;render()">← Daftar review</button></div></div>`;return}
 const g=rvAll(),ds=Object.keys(g).sort().reverse(),cnt=l=>Object.values(st.rv).flat().filter(x=>l==='all'||x.level===l).length;
 a.innerHTML=`<div class="card"><h2>🔁 Review per Level &amp; Tanggal</h2><p class="muted">Pilih level (N). Di dalam tiap level, setiap tanggal punya daftar sendiri dan tidak digabung dengan tanggal lain.</p><div class="row">${['all',...LV].map(l=>`<button class="${rvL===l?'primary':''}" onclick="rvL='${l}';render()">${l==='all'?'Semua':l} (${cnt(l)})</button>`).join('')}</div><div class="fcc" style="justify-content:flex-start"><button class="primary" onclick="startR('')">▶ Review semua ${rvL==='all'?'level':rvL}</button><button onclick="expData('${rvL==='all'?'':rvL}')">⬇ Ekspor review ${rvL==='all'?'semua level':rvL}</button><button onclick="impM='merge';$('imp').click()">⬆ Impor review (gabung)</button><input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="impData(this)"></div></div>`+(ds.map(d=>{const it=g[d];
  return `<div class="card" style="margin-top:12px"><div class="row"><h3 style="margin-right:auto">📅 ${fmt(d)}${d===today()?' (hari ini)':''}</h3><span class="pill">${it.length} materi</span><span class="pill">✅ ${it.filter(x=>x.known===true).length}</span><button class="primary" onclick="startR('${d}')">▶ Review tanggal ini</button><button onclick="delR('${d}')">🗑 Hapus</button></div><div class="grid" style="margin-top:10px">${it.map(x=>`<div class="day"><b>${x.t==='kanji'?'🈴':x.t==='vocab'?'📚':'📖'} ${esc(x.front)}</b> <span class="pill">${x.level}</span> ${x.known===true?'✅':x.known===false?'❌':''}<br><span class="muted">${rb(x)}</span></div>`).join('')}</div></div>`}).join('')||'<div class="card" style="margin-top:12px"><p class="muted">Belum ada materi ⭐ untuk pilihan ini.</p></div>')}
function startR(d){const g=rvAll(),it=d?(g[d]||[]):Object.values(g).flat();if(!it.length)return;rvs={d:d||('Semua '+(rvL==='all'?'level':rvL)),items:shuf(it),pos:0,flip:false};render()}
function rAns(k){rvs.items[rvs.pos].known=k;save();if(rvs.pos<rvs.items.length-1){rvs.pos++;rvs.flip=false}else rvs=null;render()}
function delR(d){if(!confirm('Hapus review tanggal '+d+(rvL==='all'?'':' untuk '+rvL)+'?'))return;st.rv[d]=st.rv[d].filter(x=>rvL!=='all'&&x.level!==rvL);if(!st.rv[d].length)delete st.rv[d];save();render()}
/* ---- Navigasi ---- */
const NAV=[['home','🏠 Beranda'],['kana','🔤 Kana'],['kanji','🈴 Kanji'],['vocab','📚 Daftar Kosakata'],['flashkanji','🃏 Flashcard Kanji'],['flashvocab','🃏 Flashcard Kosakata'],['quizkanji','📝 Soal Kanji'],['quizvocab','📝 Soal Kosakata'],['grammar','📖 Tata Bahasa'],['review','🔁 Review'],['tracker','📊 Perkembangan']];
const go=p=>{page=p;render()};
const lvSel=(fn='')=>`<select onchange="level=this.value;${fn}render()">${LV.map(x=>`<option ${x===level?'selected':''}>${x}</option>`).join('')}</select>`;
const pager=(v,p,t)=>`<div class="fcc"><button onclick="${v}=Math.max(0,${v}-1);render()">← Sebelumnya</button><span class="muted" style="align-self:center">Halaman ${p+1}/${t}</span><button class="primary" onclick="${v}=Math.min(${t-1},${v}+1);render()">Berikutnya →</button></div>`;
function render(){if(st.day!==today()){st.day=today();st.today=0;save()}
 $('mode').innerHTML=[['id','🇮🇩 Mode Arti'],['jp','🇯🇵 Mode Jepang (tanpa arti)']].map(x=>`<button class="${M===x[0]?'active':''}" onclick="M='${x[0]}';st.mode=M;save();qz=null;fc.deck=[];render()">${x[1]}</button>`).join('');
 $('nav').innerHTML=NAV.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
 const a=$('app');({home,kana,kanji,vocab,grammar,review,tracker,flashkanji:()=>flash(a,'kanji'),flashvocab:()=>flash(a,'vocab'),quizkanji:()=>quiz(a,'kanji'),quizvocab:()=>quiz(a,'vocab')}[page]||home)(a)}
function home(a){const p=Math.min(100,Math.round(st.today/st.goal*100));
 a.innerHTML=`<div class="grid"><div class="card"><h2>🎯 Target hari ini</h2><div class="stat">${st.today}/${st.goal}</div><div class="progress"><div class="bar" style="width:${p}%"></div></div><p>${p>=100?'Target tercapai 🔥':'Lanjutkan belajar.'}</p><button class="primary" onclick="go('quizvocab')">▶ Latihan Soal</button><button onclick="dataMsg='Memuat ulang...';render();loadOnline();loadWk(true)">↻ Muat Ulang Data</button></div><div class="card"><h2>🔥 Konsistensi</h2><div class="stat">${st.streak} hari</div></div><div class="card"><h2>📈 Akurasi</h2><div class="stat">${st.total?Math.round(st.correct/st.total*100):0}%</div><p>${st.correct} benar dari ${st.total}.</p></div></div><div class="card" style="margin-top:12px"><h2>Alur belajar</h2><p>① 🈴 Baca Kanji &amp; 📚 Kosakata → ② ✍️ Tulis di buku → ③ 🃏 Flashcard → ④ 📝 Soal bacaan → ⑤ ⭐ Review per tanggal → ⑥ Buat 1 kalimat sendiri.</p><p class="source">Sumber: 📘 WkwkJepang N5–N3 (belajar), 📝 OpenJLPT N5–N1 (soal; N2–N1 juga belajar), kanji dari OpenJLPT + kanji-data. Mode Arti menampilkan arti Indonesia; Mode Jepang tanpa arti. ${esc(wkMsg)} ${esc(dataMsg)}</p></div>`}
const RO='a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n'.split(' '),HG=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'];
function kana(a){const t=k=>`<div class="table">${HG.map((c,i)=>`<div class="kana"><b>${k?toK(c):c}</b><br><small>${RO[i]}</small></div>`).join('')}</div>`;
 a.innerHTML=`<div class="card"><h2>🔤 Hiragana</h2>${t(0)}</div><div class="card" style="margin-top:12px"><h2>🔤 Katakana</h2>${t(1)}</div>`}
let kp=0,KL=[];
function kanji(a){const f=kL(),tp=Math.max(1,Math.ceil(f.length/60));kp=Math.min(kp,tp-1);KL=f.slice(kp*60,kp*60+60);
 a.innerHTML=`<div class="card"><div class="row"><h2 style="margin-right:auto">🈴 Kanji ${level}</h2>${lvSel('kp=0;')}<span class="pill">${f.length} data</span></div><p class="muted">Klik Kanji untuk bacaan dan cara menulis. ${esc(dataMsg)}</p><div class="grid" style="margin-top:12px">${KL.map((x,i)=>`<button class="card" onclick="kd(${i})" style="text-align:center"><div class="big">${esc(x.character)}</div>${M==='id'?`<p><b>Arti:</b> ${esc(mean(x))}</p>`:''}<p><b>On:</b> ${esc((x.onyomi||[]).join('、')||'—')}<br><b>Kun:</b> ${esc((x.kunyomi||[]).join('、')||'—')}</p><small>Coretan: ${x.strokes??'—'}</small></button>`).join('')||'<p class="muted">Data belum termuat.</p>'}</div>${pager('kp',kp,tp)}</div>`;if(M==='id')lazyTr(KL)}
function kd(i){const x=KL[i],m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:#0f172ab8;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px';m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML=`<div class="card" style="width:min(680px,96vw);max-height:92vh;overflow:auto;text-align:center"><button onclick="this.parentNode.parentNode.remove()">✕ Tutup</button><div class="big" style="font-size:110px">${esc(x.character)}</div><div class="row" style="justify-content:center"><span class="pill">${x.level}</span><span class="pill">${x.strokes??'—'} coretan</span></div>${M==='id'?`<p><b>Arti:</b> ${esc(mean(x))}</p>`:''}<p><b>Onyomi:</b> ${esc((x.onyomi||[]).join('、')||'—')}<br><b>Kunyomi:</b> ${esc((x.kunyomi||[]).join('、')||'—')}</p><h3>✍️ Tata cara penulisan</h3><img class="stroke" src="${stroke(x.character)}" alt="" onerror="this.outerHTML='<p class=warn>Diagram belum dapat dimuat.</p>'"><p class="ok">Ikuti angka 1 sampai ${x.strokes??'?'} pada diagram.</p><div class="fcc">${rvBtn(kItem(x))}</div></div>`;document.body.appendChild(m)}
let vl='all',vq='',vp=0;
function vocab(a){let f=(vs==='wk'?sV():data.vocab).filter(x=>vl==='all'||x.level===vl);const q=vq.trim().toLowerCase();

function grammar(a){const f=G.filter(x=>x[0]===level);
 a.innerHTML=`<div class="card"><div class="row"><h2 style="margin-right:auto">📖 Tata Bahasa ${level}</h2>${lvSel()}<span class="pill">${f.length} pola</span></div><div class="grid" style="margin-top:12px">${f.map(x=>`<div class="card"><span class="pill">${x[0]}</span><h3>${x[1]}</h3><div class="formula">${x[2]}</div>${M==='id'?`<p><b>Arti:</b> ${x[3]}</p>`:''}<p class="ja">${x[4]}</p>${M==='id'?`<p class="muted">🇮🇩 ${x[5]}</p>`:''}<div class="fcc">${rvBtn({id:x[1]+'|'+x[0],t:'grammar',front:x[1],back:x[2]+'\n'+x[4],arti:x[3]+' — '+x[5],level:x[0]})}</div></div>`).join('')}</div></div>`}
function tracker(a){const acc=st.total?Math.round(st.correct/st.total*100):0,ds=Object.entries(st.days).sort((x,y)=>y[0].localeCompare(x[0])).slice(0,14);
 a.innerHTML=`<div class="grid"><div class="card"><h3>🔥 Konsistensi</h3><div class="stat">${st.streak} hari</div></div><div class="card"><h3>🎯 Target</h3><div class="stat">${st.today}/${st.goal}</div></div><div class="card"><h3>📈 Akurasi</h3><div class="stat">${acc}%</div></div><div class="card"><h3>📝 Sesi</h3><div class="stat">${st.sessions}</div></div></div><div class="card" style="margin-top:12px"><h2>⚙️ Target harian</h2><input type="number" min="1" max="100" value="${st.goal}" onchange="st.goal=Math.max(1,+this.value);save();render()"> soal benar/hari</div><div class="card" style="margin-top:12px"><h2>📅 Riwayat harian</h2>${ds.map(x=>`<div class="day"><b>${x[0]}</b> — ${x[1]} jawaban benar</div>`).join('')||'<p class="muted">Belum ada riwayat.</p>'}</div><div class="card" style="margin-top:12px"><h2>💾 Cadangan data</h2><p class="muted">Simpan semua ⭐ Review per tanggal, konsistensi, dan riwayat ke satu file. Gabung = menambah tanpa menghapus. Ganti = menimpa semua data. File cadangan dari aplikasi lama juga bisa diimpor.</p><div class="fcc" style="justify-content:flex-start"><button class="primary" onclick="expData('')">⬇ Ekspor Semua</button><button onclick="impM='merge';$('imp').click()">⬆ Impor &amp; Gabung</button><button onclick="impM='replace';$('imp').click()">⬆ Impor &amp; Ganti</button><input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="impData(this)"></div></div>`}
const DEF={total:0,correct:0,sessions:0,today:0,day:'',streak:0,goal:10,days:{},rv:{}};
function norm(o){o={...o};o.rv=o.rv||{};
 if(o.review){for(const t of ['kanji','vocab','grammar'])for(const x of(o.review[t]||[])){const d=x.markedDate||'tanpa-tanggal',ex=String(x.extra||'').replace(/<br>/g,'\n');
  (o.rv[d]=o.rv[d]||[]).push(t==='vocab'?{id:x.id,t,front:x.front,back:ex,arti:x.back,level:x.level,known:null}:t==='kanji'?{id:x.id,t,front:x.front,back:'',arti:x.back,level:x.level,known:null}:{id:x.id,t,front:x.front,back:ex,arti:x.back,level:x.level,known:null})}
  delete o.review}
 return o}
function mergeSt(a,b){b=norm(b);const o={...a,rv:{...a.rv},days:{...a.days}};
 for(const d in b.rv){const cur=o.rv[d]=[...(o.rv[d]||[])];for(const x of b.rv[d])if(!cur.some(y=>y.id===x.id))cur.push(x)}
 for(const d in (b.days||{}))o.days[d]=Math.max(o.days[d]||0,b.days[d]);
 for(const k of ['total','correct','sessions','streak','goal'])o[k]=Math.max(o[k]||0,b[k]||0);return o}
let impM='merge';
function expData(lv){let o=st;if(lv){const rv={};for(const d in st.rv){const a=st.rv[d].filter(x=>x.level===lv);if(a.length)rv[d]=a}o={rv}}
 const b=new Blob([JSON.stringify({app:'jpall',v:2,st:o,tr})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(lv?'review-'+lv:'cadangan-belajar')+'-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function impData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.st||typeof j.st!=='object')throw 0;
  if(impM==='merge')st=mergeSt(st,j.st);else{if(!confirm('Semua data sekarang akan DIGANTI isi file. Lanjutkan?')){inp.value='';return}st={...DEF,...norm(j.st)}}
  save();if(j.tr){Object.assign(tr,j.tr);try{localStorage.setItem('jm_tr',JSON.stringify(tr))}catch(e){}}alert('Impor berhasil.');location.reload()}catch(e){alert('File cadangan tidak valid.');inp.value=''}};r.readAsText(f)}
if(!localStorage.getItem(KEY)){for(const k of ['jm_stable_v3','jm_jp_v1']){try{const o=JSON.parse(localStorage.getItem(k));if(o)st=mergeSt(st,o)}catch(e){}}save()}
