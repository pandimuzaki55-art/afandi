const gItem=g=>({id:g[1]+'|'+g[0],t:'grammar',front:g[1],back:g[2]+'\n'+g[4],arti:g[3]+' — '+g[5],level:g[0]});

function kq(x,ty,pool){let q=x.character,h,ans,d;
 if(ty==='arti'){h='Apa artinya?';ans=mean(x);d=pool.map(mean)}
 else if(ty==='baca'){h='Bagaimana cara bacanya?';ans=yomi(x);d=pool.map(yomi)}
 else{const ws=data.vocab.filter(v=>v.word.includes(x.character));if(!ws.length)return null;const w=pick(ws);
  if(ty==='kata'){h='Kosakata mana yang memakai kanji ini?';ans=w.word;d=shuf(data.vocab.filter(v=>!v.word.includes(x.character))).slice(0,30).map(v=>v.word)}
  else{q=w.word;h='Kanji mana yang ada dalam kata ini?';ans=x.character;d=pool.filter(y=>!w.word.includes(y.character)).map(y=>y.character)}}
 d=[...new Set(shuf(d).filter(v=>v&&v!==ans))].slice(0,3);return d.length<3?null:{x,q,h,ans,opts:shuf([ans,...d])}}
async function startQ(t){if(t!=='kanji')return startQ0(t);const id=M==='id',kt=($('qk')&&$('qk').value)||'mix';
 const pool=kL().filter(x=>id||(x.onyomi||[]).length||(x.kunyomi||[]).length);if(pool.length<4){alert('Data '+level+' belum cukup / belum termuat.');return}
 const tys=kt==='mix'?(id?['arti','baca','kata','kanjidr']:['baca','kata','kanjidr']):[kt==='arti'&&!id?'baca':kt];
 const p=shuf(pool).slice(0,Math.min(+$('qn').value,pool.length)),ex=shuf(pool.filter(x=>!p.includes(x))).slice(0,15);
 if(tys.includes('arti'))await trAll([...p,...ex]);
 const items=[];for(const x of p)for(const ty of shuf(tys)){const q=kq(x,ty,[...p,...ex].filter(y=>y!==x));if(q){items.push(q);break}}
 if(items.length<3){alert('Soal belum cukup, coba level/jenis lain.');return}
 qz={t,m:M,items,pos:0,score:0,done:false,start:Date.now()};render()}

function chk(s,g,isG){const r=[];
 r.push([/[ぁ-ゖァ-ヺ一-龯]/.test(s)&&!/[A-Za-z]{2,}/.test(s),'Ditulis dalam bahasa Jepang (tanpa romaji)']);

 r.push([/[。！？!?]$/.test(s),'Diakhiri tanda baca (。！？)']);
 r.push([/(です|ます|でした|ました|ません|ない|だ|た|る|う|く|す|つ|ぬ|ぶ|む|ぐ|い|よ|ね|か)[。！？!?]$/.test(s),'Diakhiri bentuk kata kerja/sifat yang wajar']);
 r.push([!/(を|が)\1/.test(s)&&!/(です|ます)だ/.test(s),'Tidak ada partikel ganda / campuran gaya yang janggal']);
 if(isG){const al=gAlts(g);r.push(al?[al.some(p=>p.every(q=>s.includes(q))),'Memakai pola 「'+g[1]+'」']:[null,'Pola ini tidak bisa dicek otomatis']);}
 else{const w=g.word,f=[w,g.reading||''];if(w.length>2&&/[るうくぐすつぬぶむい]$/.test(w))f.push(w.slice(0,-1));r.push([f.some(q=>q&&s.includes(q)),'Memakai kata 「'+w+'」']);}
 return r}

 if(n<sh.rep)setTimeout(step,p);else if(sh.auto&&sh.i<l.length-1)setTimeout(()=>{if(stopF)return;sh.i++;n=0;render();step()},p)})};step()}

async function micStart(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);chunks=[];mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=()=>{audioURL=URL.createObjectURL(new Blob(chunks));s.getTracks().forEach(t=>t.stop());sh.msg='Rekaman siap — putar dan bandingkan dengan suara asli.';render()};mr.start();sh.msg='🔴 Merekam... tekan Stop Rekam'}catch(e){sh.msg='Mikrofon tidak tersedia / izin ditolak.'}render()}

function sim(a,b){a=[...a.replace(/[\s。、！？!?,.]/g,'')];b=[...b.replace(/[\s。、！？!?,.]/g,'')];const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return a.length+b.length?Math.round(200*d[a.length][b.length]/(a.length+b.length)):0}

function fcSpk(){if(!fc.deck.length)return;const x=fc.deck[fc.i];spk(encodeURIComponent(fc.t==='kanji'?kSay(x):(x.reading||x.word)))}

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('jm_sfx',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(){const d=await idb();return new Promise(res=>{const q=d.transaction('f').objectStore('f').get('w');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}
async function idbPut(b){const d=await idb();return new Promise(res=>{const t=d.transaction('f','readwrite');b?t.objectStore('f').put(b,'w'):t.objectStore('f').delete('w');t.oncomplete=()=>res()})}
async function sfxUpload(i){const f=i.files[0];if(!f)return;if(f.size>8e6){alert('File terlalu besar (maks 8 MB).');return}try{await idbPut(f);alert('Suara tersimpan. Tekan "Coba suara".')}catch(e){alert('Penyimpanan suara tidak tersedia di browser ini.')}}
function tone(ty,f1,f2,t,d,v){const c=tac.currentTime,o=tac.createOscillator(),g=tac.createGain();o.type=ty;o.frequency.setValueAtTime(f1,c+t);o.frequency.exponentialRampToValueAtTime(f2,c+t+d);g.gain.setValueAtTime(.0001,c+t);g.gain.exponentialRampToValueAtTime(v,c+t+.03);g.gain.exponentialRampToValueAtTime(.0001,c+t+d);o.connect(g);g.connect(tac.destination);o.start(c+t);o.stop(c+t+d+.05)}
function noise(t,d,v){const n=Math.floor(tac.sampleRate*d),b=tac.createBuffer(1,n,tac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=tac.createBufferSource(),g=tac.createGain(),h=tac.createBiquadFilter();h.type='highpass';h.frequency.value=1800;s.buffer=b;g.gain.value=v;s.connect(h);h.connect(g);g.connect(tac.destination);s.start(tac.currentTime+t)}
function synth(k){taudio();if(!tac)return;try{if(k==='open'){tone('sine',110,38,0,.5,.7);tone('sawtooth',70,620,.1,1.1,.22);tone('square',55,220,.2,1,.08);noise(.95,.5,.35);tone('sine',880,880,1,.8,.25);tone('sine',1320,1320,1.05,.9,.18)}else{noise(0,.3,.5);tone('sawtooth',900,200,0,.25,.2);tone('sine',660,660,.25,.5,.2)}}catch(e){}}
function voice(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;u.pitch=.7;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function norm(o){o={...o};o.rv=o.rv||{};
 if(o.review){for(const t of ['kanji','vocab','grammar'])for(const x of(o.review[t]||[])){const d=x.markedDate||'tanpa-tanggal',ex=String(x.extra||'').replace(/<br>/g,'\n');
  (o.rv[d]=o.rv[d]||[]).push(t==='vocab'?{id:x.id,t,front:x.front,back:ex,arti:x.back,level:x.level,known:null}:t==='kanji'?{id:x.id,t,front:x.front,back:'',arti:x.back,level:x.level,known:null}:{id:x.id,t,front:x.front,back:ex,arti:x.back,level:x.level,known:null})}
  delete o.review}
 return o}
function mergeSt(a,b){b=norm(b);const o={...a,rv:{...a.rv},days:{...a.days}};
 for(const d in b.rv){const cur=o.rv[d]=[...(o.rv[d]||[])];for(const x of b.rv[d])if(!cur.some(y=>y.id===x.id))cur.push(x)}
 for(const d in (b.days||{}))o.days[d]=Math.max(o.days[d]||0,b.days[d]);
 for(const k of ['total','correct','sessions','streak','goal'])o[k]=Math.max(o[k]||0,b[k]||0);o.err={...(a.err||{}),...(b.err||{})};o.sent=[...(a.sent||[]),...(b.sent||[])];o.shad=[...(a.shad||[])];o.tg=a.tg||b.tg;o.tm=a.tm||b.tm;o.lastBackup=a.lastBackup||b.lastBackup;o.srs={...(b.srs||{}),...(a.srs||{})};o.sch={...(b.sch||{}),...(a.sch||{})};o.wr={...(b.wr||{}),...(a.wr||{})};o.mocks=[...(a.mocks||[]),...(b.mocks||[])];for(const x of b.shad||[])if(!o.shad.some(y=>y.id===x.id))o.shad.push(x);return o}
