 else if(ty==='baca'){h='Bagaimana cara bacanya?';ans=yomi(x);d=pool.map(yomi)}
 else{const ws=data.vocab.filter(v=>v.word.includes(x.character));if(!ws.length)return null;const w=pick(ws);
  if(ty==='kata'){h='Kosakata mana yang memakai kanji ini?';ans=w.word;d=shuf(data.vocab.filter(v=>!v.word.includes(x.character))).slice(0,30).map(v=>v.word)}
  else{q=w.word;h='Kanji mana yang ada dalam kata ini?';ans=x.character;d=pool.filter(y=>!w.word.includes(y.character)).map(y=>y.character)}}
 d=[...new Set(shuf(d).filter(v=>v&&v!==ans))].slice(0,3);return d.length<3?null:{x,q,h,ans,opts:shuf([ans,...d])}}
async function startQ(t){if(t!=='kanji')return startQ0(t);const id=M==='id',kt=($('qk')&&$('qk').value)||'mix';
 const pool=kL().filter(x=>id||(x.onyomi||[]).length||(x.kunyomi||[]).length);if(pool.length<4){alert('Data '+level+' belum cukup / belum termuat.');return}
 const tys=kt==='mix'?(id?['arti','baca','kata','kanjidr']:['baca','kata','kanjidr']):[kt==='arti'&&!id?'baca':kt];
 const p=shuf(pool).slice(0,Math.min(+$('qn').value,pool.length)),ex=shuf(pool.filter(x=>!p.includes(x))).slice(0,15);
 if(tys.includes('arti'))await trAll([...p,...ex]);
 const items=[];for(const x of p)for(const ty of shuf(tys)){const q=kq(x,ty,[...p,...ex].filter(y=>y!==x));if(q){items.push(q);break}}
 if(items.length<3){alert('Soal belum cukup, coba level/jenis lain.');return}
 qz={t,m:M,items,pos:0,score:0,done:false,start:Date.now()};render()}

function chk(s,g,isG){const r=[];
 r.push([/[ぁ-ゖァ-ヺ一-龯]/.test(s)&&!/[A-Za-z]{2,}/.test(s),'Ditulis dalam bahasa Jepang (tanpa romaji)']);

 r.push([/[。！？!?]$/.test(s),'Diakhiri tanda baca (。！？)']);
 r.push([/(です|ます|でした|ました|ません|ない|だ|た|る|う|く|す|つ|ぬ|ぶ|む|ぐ|い|よ|ね|か)[。！？!?]$/.test(s),'Diakhiri bentuk kata kerja/sifat yang wajar']);
 r.push([!/(を|が)\1/.test(s)&&!/(です|ます)だ/.test(s),'Tidak ada partikel ganda / campuran gaya yang janggal']);

 else{const w=g.word,f=[w,g.reading||''];if(w.length>2&&/[るうくぐすつぬぶむい]$/.test(w))f.push(w.slice(0,-1));r.push([f.some(q=>q&&s.includes(q)),'Memakai kata 「'+w+'」']);}
 return r}

BACA.push(['N2','働き方の変化','近年、在宅勤務を取り入れる企業が増えている。通勤の負担が減るという利点がある一方で、同僚との交流が少なくなり、孤独を感じる人もいる。そのため、週に数日だけ出社する企業も出てきた。','Belakangan banyak perusahaan menerapkan kerja dari rumah. Di satu sisi beban perjalanan berkurang, di sisi lain interaksi dengan rekan berkurang dan ada yang merasa kesepian. Karena itu muncul perusahaan yang meminta masuk kantor hanya beberapa hari seminggu.',[['在宅勤務','ざいたくきんむ','kerja dari rumah'],['利点','りてん','keunggulan'],['交流','こうりゅう','interaksi']],[['在宅勤務の利点として挙げられているのは何ですか。',['通勤の負担が減ること','給料が上がること','同僚が増えること','仕事が減ること'],0],['週に数日だけ出社する企業が出てきたのはなぜですか。',['孤独を感じる人がいるから','通勤が楽だから','給料が下がったから','会議が多いから'],0]]],
['N2','読書の習慣','本を読む習慣がある人は、語彙が豊富で、物事を深く考える傾向があると言われている。しかし、忙しくて時間が取れないという人も多い。そんな人には、通勤時間などの短い時間を利用して、少しずつ読むことをすすめたい。','Orang yang punya kebiasaan membaca konon kosakatanya kaya dan cenderung berpikir mendalam. Namun banyak yang sibuk dan tidak punya waktu. Kepada mereka saya menyarankan membaca sedikit demi sedikit memanfaatkan waktu singkat seperti perjalanan ke kantor.',[['習慣','しゅうかん','kebiasaan'],['語彙','ごい','kosakata'],['傾向','けいこう','kecenderungan']],[['筆者は、忙しい人にどうすることをすすめていますか。',['短い時間を使って少しずつ読む','休みの日にまとめて読む','本を買わない','読書をやめる'],0],['本を読む習慣がある人について、どう言われていますか。',['語彙が豊富で深く考える','忙しくない','本が嫌いだ','早く寝る'],0]]],
['N2','節約のコツ','節約というと、我慢することだと思われがちだが、実は無駄をなくすことが大切だ。例えば、使っていないサービスの契約をやめるだけでも、毎月の支出はかなり減る。','Soal berhemat, sering dianggap menahan diri, padahal yang penting adalah menghilangkan pemborosan. Misalnya hanya dengan menghentikan langganan layanan yang tidak dipakai, pengeluaran bulanan berkurang cukup banyak.',[['節約','せつやく','berhemat'],['無駄','むだ','pemborosan'],['支出','ししゅつ','pengeluaran']],[['筆者によると、節約で大切なことは何ですか。',['無駄をなくすこと','我慢すること','収入を増やすこと','買い物をやめること'],0],['支出を減らす例として挙げられているのは何ですか。',['使っていないサービスをやめる','食事の量を減らす','電気を消す','引っ越しをする'],0]]],
['N1','情報の取捨選択','情報があふれる現代では、必要な情報を見極める力が求められている。膨大な情報の中から、信頼できるものだけを選び取るには、発信元や根拠を確認する習慣が欠かせない。','Di era informasi melimpah, kemampuan menilai informasi yang diperlukan dituntut. Untuk memilih hanya yang terpercaya dari informasi yang sangat banyak, kebiasaan memeriksa sumber dan dasarnya tidak boleh ditinggalkan.',[['見極める','みきわめる','menilai dengan cermat'],['膨大','ぼうだい','sangat banyak'],['欠かせない','かかせない','tak boleh ditinggalkan']],[['筆者が欠かせないと述べているのは何ですか。',['発信元や根拠を確認する習慣','情報をたくさん集めること','情報を発信すること','ニュースを見ないこと'],0],['現代はどのような時代だと述べていますか。',['情報があふれる時代','情報が少ない時代','技術が遅れた時代','静かな時代'],0]]],
['N1','失敗から学ぶ','失敗を恐れるあまり、新しいことに挑戦できない人は少なくない。しかし、失敗は成功への過程にすぎず、そこから得られる教訓こそが次の成長につながる。','Tidak sedikit orang yang karena terlalu takut gagal tidak bisa menantang hal baru. Namun kegagalan hanyalah proses menuju sukses, dan pelajaran darinya justru menjadi jalan menuju pertumbuhan berikutnya.',[['挑戦','ちょうせん','tantangan'],['過程','かてい','proses'],['教訓','きょうくん','pelajaran']],[['筆者は、失敗をどう考えていますか。',['成功への過程にすぎない','避けるべきものだ','恥ずかしいものだ','意味がないものだ'],0],['次の成長につながるのは何ですか。',['失敗から得られる教訓','失敗しないこと','成功の自慢','挑戦をやめること'],0]]],
['N1','言葉の力','言葉は、人を励ますこともあれば、深く傷つけることもある。だからこそ、相手の立場を考えたうえで、慎重に言葉を選ぶ必要がある。','Kata-kata bisa menyemangati, tetapi juga bisa melukai dalam-dalam. Karena itu perlu memilih kata dengan hati-hati setelah memikirkan posisi lawan bicara.',[['励ます','はげます','menyemangati'],['傷つける','きずつける','melukai'],['慎重','しんちょう','hati-hati']],[['筆者は、言葉を選ぶとき何が必要だと述べていますか。',['相手の立場を考えること','早く話すこと','たくさん話すこと','自分の意見を押しつけること'],0],['言葉には、どのような面があると述べていますか。',['励ますことも傷つけることもある','役に立たない','短ければよい','誰にでも同じ意味だ'],0]]]);
